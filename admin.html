
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NEXORA | Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" type="module"></script>
</head>
<body>

<div class="admin-layout">

  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand">
      <span class="brand-icon">N</span>
      <span>NEXORA <small>ADMIN</small></span>
    </a>

    <nav class="sidebar-nav">
      <a href="#dashboard">الرئيسية</a>
      <a href="#articles">إدارة المقالات</a>
      <a href="#messages">رسائل الزوار</a>
      <a href="index.html">عرض الموقع</a>
    </nav>

    <button id="logoutButton" type="button">تسجيل الخروج</button>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <button id="menuToggle" type="button">☰</button>
      <div>
        <strong>NEXORA ADMIN</strong>
        <small>لوحة إدارة المنصة</small>
      </div>
    </header>

    <section id="loginSection" class="panel">
      <h1>تسجيل دخول المدير</h1>
      <p>سجّل الدخول بحساب المدير المسجل في Supabase.</p>

      <form id="loginForm">
        <label for="adminEmail">البريد الإلكتروني</label>
        <input id="adminEmail" type="email" required
          autocomplete="username">

        <label for="adminPassword">كلمة المرور</label>
        <input id="adminPassword" type="password" required
          autocomplete="current-password">

        <button type="submit">دخول</button>
      </form>

      <p id="loginStatus" role="status"></p>
    </section>

    <section id="adminDashboard" hidden>

      <section id="dashboard" class="welcome">
        <h1>مرحباً بك في إدارة NEXORA</h1>
        <p id="adminEmailDisplay"></p>
      </section>

      <div class="stats-grid">
        <article class="stat-card">
          <span>المقالات</span>
          <strong id="articlesCount">0</strong>
        </article>

        <article class="stat-card">
          <span>الرسائل</span>
          <strong id="messagesCount">0</strong>
        </article>
      </div>

      <section class="panel" id="articles">
        <h2>إدارة المقالات</h2>

        <form id="articleForm">
          <input type="hidden" id="articleId">

          <label for="articleTitle">عنوان المقال</label>
          <input id="articleTitle" type="text"
            maxlength="200" required>

          <label for="articleSlug">رابط المقال (Slug)</label>
          <input id="articleSlug" type="text"
            maxlength="200" required>

          <label for="articleExcerpt">ملخص المقال</label>
          <textarea id="articleExcerpt" maxlength="500"></textarea>

          <label for="articleContent">محتوى المقال</label>
          <textarea id="articleContent" required></textarea>

          <label for="articleImage">رابط الصورة</label>
          <input id="articleImage" type="url">

          <label for="articleStatus">حالة المقال</label>
          <select id="articleStatus">
            <option value="draft">مسودة</option>
            <option value="published">منشور</option>
          </select>

          <button type="submit" id="saveArticleButton">
            حفظ المقال
          </button>

          <button type="button" id="cancelEditButton">
            إلغاء التعديل
          </button>
        </form>

        <p id="articleStatusMessage" role="status"></p>

        <h3>المقالات الحالية</h3>
        <div id="articlesList">جاري التحميل...</div>
      </section>

      <section class="panel" id="messages">
        <h2>رسائل الزوار</h2>
        <p id="messagesStatus" role="status"></p>
        <div id="messagesList">جاري التحميل...</div>
      </section>

    </section>

  </main>
</div>

</body>
</html>
